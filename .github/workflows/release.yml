name: Build and publish MyBuddy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      MYBUDDY_GOOGLE_CLIENT_ID: ${{ vars.MYBUDDY_GOOGLE_CLIENT_ID }}
      MYBUDDY_GOOGLE_CLIENT_SECRET: ${{ secrets.MYBUDDY_GOOGLE_CLIENT_SECRET }}
      MYBUDDY_RELEASES_TOKEN: ${{ secrets.MYBUDDY_RELEASES_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Validate release configuration
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($config.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag must be $expectedTag to match tauri.conf.json version $($config.version)."
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Add the TAURI_SIGNING_PRIVATE_KEY repository secret before releasing."
          }
          if (-not $env:MYBUDDY_RELEASES_TOKEN) {
            throw "Add the MYBUDDY_RELEASES_TOKEN repository secret before releasing."
          }
          if ($config.plugins.updater.pubkey -like "REPLACE_*") {
            throw "Replace the updater public-key placeholder in src-tauri/tauri.conf.json before releasing."
          }
          if (-not $env:MYBUDDY_GOOGLE_CLIENT_ID) {
            Write-Warning "MYBUDDY_GOOGLE_CLIENT_ID repository variable is empty; Google Calendar will not be configured in this release."
          }
          if (-not $env:MYBUDDY_GOOGLE_CLIENT_SECRET) {
            Write-Warning "MYBUDDY_GOOGLE_CLIENT_SECRET repository secret is empty; Google Calendar will not be configured in this release."
          }

      - name: Build and publish signed release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.MYBUDDY_RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MYBUDDY_GOOGLE_CLIENT_ID: ${{ vars.MYBUDDY_GOOGLE_CLIENT_ID }}
          MYBUDDY_GOOGLE_CLIENT_SECRET: ${{ secrets.MYBUDDY_GOOGLE_CLIENT_SECRET }}
        with:
          tauriScript: bun run tauri
          owner: vedantchavare04
          repo: myBuddy-releases
          tagName: ${{ github.ref_name }}
          releaseCommitish: main
          releaseName: MyBuddy ${{ github.ref_name }}
          releaseBody: See the release notes below for changes in this version.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: --bundles nsis,msi

      - name: Add stable Windows installer download
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.MYBUDDY_RELEASES_TOKEN }}
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "mybuddy-release"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          gh release download "$env:GITHUB_REF_NAME" `
            --repo "vedantchavare04/myBuddy-releases" `
            --pattern "MyBuddy_*_x64-setup.exe" `
            --dir $releaseDir

          $installer = Get-ChildItem -Path $releaseDir -Filter "MyBuddy_*_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Could not find the Windows setup .exe in the release."
          }

          $stableInstaller = Join-Path $releaseDir "MyBuddy-Setup.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $stableInstaller -Force

          gh release upload "$env:GITHUB_REF_NAME" "$stableInstaller" `
            --repo "vedantchavare04/myBuddy-releases" `
            --clobber


